! ==============================================================================
! Device: Main-Core-R2 (Cisco 2911 ISR)
! Role: Active HSRP Gateway for VLANs 40, 50, 60; Standby for 10, 20, 30, 70, 99
! Dependencies: Connect Gig0/0 to Main-Core-SW2 Gig0/1 (Trunk)
!               Connect Gig0/1 to Main-Core-R1 Gig0/1 (P2P Interconnect)
!               Connect Gig0/2 to Main-Edge-Rtr Gig0/1 (Transit Link)
! ==============================================================================

enable
configure terminal

hostname Main-Core-R2

! --- Security & Remote Access Baseline ---
no ip domain-lookup
ip domain-name smartcampus.edu
enable secret CiscoUni2026!

username admin privilege 15 secret CiscoUni2026!
crypto key generate rsa modulus 2048
ip ssh version 2

line con 0
 password CiscoUni2026!
 login
 logging synchronous
 exec-timeout 10 0
 exit

line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
 exit

banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED UNIVERSITY NETWORK ENGINEERING ACCESS ONLY              *
* System: Main-Core-R2 | Location: Main Campus Secondary Facility             *
*******************************************************************************
^C

! --- Inter-VLAN Routing Subinterfaces (802.1Q) & HSRP Configuration ---
interface GigabitEthernet0/0
 no ip address
 no shutdown
 exit

! VLAN 10: Administration (HSRP Standby)
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.5.3 255.255.255.192
 standby 10 ip 10.10.5.1
 standby 10 priority 90
 standby 10 preempt
 no shutdown
 exit

! VLAN 20: Faculty (HSRP Standby)
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.4.131 255.255.255.128
 standby 20 ip 10.10.4.129
 standby 20 priority 90
 standby 20 preempt
 no shutdown
 exit

! VLAN 30: Computer Labs (HSRP Standby)
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.10.4.3 255.255.255.128
 standby 30 ip 10.10.4.1
 standby 30 priority 90
 standby 30 preempt
 no shutdown
 exit

! VLAN 40: Students & Wi-Fi (HSRP Active)
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 10.10.2.3 255.255.254.0
 standby 40 ip 10.10.2.1
 standby 40 priority 110
 standby 40 preempt
 standby 40 track GigabitEthernet0/2 25
 no shutdown
 exit

! VLAN 50: Hostel & Wi-Fi (HSRP Active)
interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 ip address 10.10.0.3 255.255.254.0
 standby 50 ip 10.10.0.1
 standby 50 priority 110
 standby 50 preempt
 standby 50 track GigabitEthernet0/2 25
 no shutdown
 exit

! VLAN 60: University Library (HSRP Active)
interface GigabitEthernet0/0.60
 encapsulation dot1Q 60
 ip address 10.10.5.67 255.255.255.192
 standby 60 ip 10.10.5.65
 standby 60 priority 110
 standby 60 preempt
 standby 60 track GigabitEthernet0/2 25
 no shutdown
 exit

! VLAN 70: Data Center / Server Farm (HSRP Standby)
interface GigabitEthernet0/0.70
 encapsulation dot1Q 70
 ip address 10.10.5.135 255.255.255.224
 standby 70 ip 10.10.5.129
 standby 70 priority 90
 standby 70 preempt
 no shutdown
 exit

! VLAN 99: IT & NOC Management (HSRP Standby)
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99
 ip address 10.10.5.163 255.255.255.240
 standby 99 ip 10.10.5.161
 standby 99 priority 90
 standby 99 preempt
 no shutdown
 exit

! --- Inter-Router Physical Transit Interfaces ---
! Core Interconnect to Main-Core-R1
interface GigabitEthernet0/1
 description Interconnect Link to Main-Core-R1
 ip address 10.10.7.2 255.255.255.252
 no shutdown
 exit

! Transit Link to Main-Edge-Rtr
interface GigabitEthernet0/2
 description Transit Link to Main-Edge-Rtr
 ip address 10.10.7.9 255.255.255.252
 no shutdown
 exit

! --- Multi-Area OSPF Routing Protocol ---
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 ! Area 0 Backbone Connection (Transit to Edge)
 network 10.10.7.8 0.0.0.3 area 0
 ! Area 1 Internal Core Interconnect
 network 10.10.7.0 0.0.0.3 area 1
 ! Area 1 Campus Department Subnets
 network 10.10.0.0 0.0.1.255 area 1
 network 10.10.2.0 0.0.1.255 area 1
 network 10.10.4.0 0.0.0.127 area 1
 network 10.10.4.128 0.0.0.127 area 1
 network 10.10.5.0 0.0.0.63 area 1
 network 10.10.5.64 0.0.0.63 area 1
 network 10.10.5.128 0.0.0.31 area 1
 network 10.10.5.160 0.0.0.15 area 1
 ! OSPF Route Summarization into Area 0
 area 1 range 10.10.0.0 255.255.248.0
 ! Passive Interfaces
 passive-interface GigabitEthernet0/0.10
 passive-interface GigabitEthernet0/0.20
 passive-interface GigabitEthernet0/0.30
 passive-interface GigabitEthernet0/0.40
 passive-interface GigabitEthernet0/0.50
 passive-interface GigabitEthernet0/0.60
 passive-interface GigabitEthernet0/0.70
 passive-interface GigabitEthernet0/0.99
 exit

! --- SNMP Management Configuration ---
snmp-server community campus-ro RO
snmp-server community campus-rw RW
snmp-server enable traps
snmp-server host 10.10.5.132 version 2c campus-ro

end
write memory
