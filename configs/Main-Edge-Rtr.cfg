! ==============================================================================
! Device: Main-Edge-Rtr (Cisco 2911 ISR with Security Image)
! Role: Campus Border Gateway, OSPF Area 0 Backbone, NAT/PAT, IPsec Site-to-Site VPN,
!       Isolated RIPv2 Testing Endpoint, Firewall Filtering
! Dependencies: Connect Gig0/0 to Main-Core-R1 Gig0/2 (Transit Link 1)
!               Connect Gig0/1 to Main-Core-R2 Gig0/2 (Transit Link 2)
!               Connect Gig0/2 to ISP-Router Gig0/0 (Public Internet WAN)
!               Connect Serial0/0/0 to ISP-Router Serial0/0/0 (Isolated RIPv2 Link)
! ==============================================================================

enable
configure terminal

hostname Main-Edge-Rtr

! --- Security & Remote Access Baseline ---
no ip domain-lookup
ip domain-name smartcampus.edu
enable secret CiscoUni2026!

username admin privilege 15 secret CiscoUni2026!
crypto key generate rsa modulus 2048
ip ssh version 2

line con 0
 password CiscoUni2026!
 login
 logging synchronous
 exec-timeout 10 0
 exit

line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
 exit

banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED UNIVERSITY NETWORK ENGINEERING ACCESS ONLY              *
* System: Main-Edge-Rtr | Role: Border Gateway & Security Policy Firewall     *
*******************************************************************************
^C

! --- Interface Configuration ---
! Transit Link to Main-Core-R1
interface GigabitEthernet0/0
 description Core Transit Link to Main-Core-R1
 ip address 10.10.7.6 255.255.255.252
 ip nat inside
 no shutdown
 exit

! Transit Link to Main-Core-R2
interface GigabitEthernet0/1
 description Core Transit Link to Main-Core-R2
 ip address 10.10.7.10 255.255.255.252
 ip nat inside
 no shutdown
 exit

! Public Internet WAN Interface
interface GigabitEthernet0/2
 description Public WAN Interface to ISP-Router
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 crypto map CAMPUS-VPN-MAP
 no shutdown
 exit

! Isolated Serial Interface for RIPv2 Timers & Convergence Experiment
interface Serial0/0/0
 description Isolated RIPv2 Test WAN Link to ISP-Router
 ip address 198.51.100.1 255.255.255.252
 no shutdown
 exit

! --- Default & Static Routing ---
! Default route to Internet via ISP Gateway
ip route 0.0.0.0 0.0.0.0 203.0.113.2
! Static route for Remote Campus over VPN peer (fallback / routing engine pointer)
ip route 10.10.6.0 255.255.255.0 203.0.113.2

! --- Multi-Area OSPF (Backbone Area 0) ---
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 ! Area 0 Backbone Transit Subnets
 network 10.10.7.4 0.0.0.3 area 0
 network 10.10.7.8 0.0.0.3 area 0
 ! Inject Default Route into OSPF for Main Campus
 default-information originate
 ! Passive interfaces on WAN and Serial to isolate internal OSPF domain
 passive-interface GigabitEthernet0/2
 passive-interface Serial0/0/0
 exit

! --- Isolated RIPv2 Configuration (Laboratory Demonstration) ---
router rip
 version 2
 no auto-summary
 timers basic 30 180 180 240
 network 198.51.100.0
 ! Ensure RIP runs ONLY on the isolated serial link and does not pollute LAN
 passive-interface default
 no passive-interface Serial0/0/0
 exit

! --- Network Address Translation (NAT / PAT) with VPN Bypass ---
! ACL 101: Deny traffic destined to Remote Campus from being NATed (Inter-campus VPN),
! permit all other internal campus subnets to be translated to public WAN IP.
ip access-list extended ACL-NAT-INTERNET
 remark Bypass NAT for Site-to-Site VPN Traffic to Remote Campus
 deny ip 10.10.0.0 0.0.7.255 10.10.6.0 0.0.0.255
 remark Permit all campus subnets for outbound Internet PAT
 permit ip 10.10.0.0 0.0.7.255 any
 exit

ip nat inside source list ACL-NAT-INTERNET interface GigabitEthernet0/2 overload

! --- Site-to-Site IPsec VPN Configuration (Main to Remote Campus) ---
! 1. ISAKMP Phase 1 Policy
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
 exit

! 2. ISAKMP Pre-Shared Key
crypto isakmp key CiscoUni2026! address 203.0.113.5

! 3. IPsec Phase 2 Transform Set
crypto ipsec transform-set CAMPUS-TS esp-aes esp-sha-hmac
 exit

! 4. Crypto Access-List defining Interesting Traffic
ip access-list extended ACL-VPN-TRAFFIC
 remark Interesting Traffic: Main Campus Supernet to Remote Campus Supernet
 permit ip 10.10.0.0 0.0.7.255 10.10.6.0 0.0.0.255
 exit

! 5. Crypto Map Association
crypto map CAMPUS-VPN-MAP 10 ipsec-isakmp
 set peer 203.0.113.5
 set transform-set CAMPUS-TS
 match address ACL-VPN-TRAFFIC
 exit

! --- Edge Security Firewall Policy (WAN Inbound Protection) ---
ip access-list extended ACL-FIREWALL-WAN-IN
 remark Allow ISAKMP and IPsec negotiation from Remote Edge Router
 permit udp host 203.0.113.5 host 203.0.113.1 eq isakmp
 permit esp host 203.0.113.5 host 203.0.113.1
 remark Allow return ICMP echo replies for diagnostics
 permit icmp any any echo-reply
 permit icmp any any unreachable
 permit icmp any any time-exceeded
 remark Allow return TCP traffic for established connections
 permit tcp any 10.10.0.0 0.0.7.255 established
 remark Explicit Deny all other unsolicited inbound WAN attempts
 deny ip any any
 exit

interface GigabitEthernet0/2
 ip access-group ACL-FIREWALL-WAN-IN in
 exit

! --- SNMP Monitoring ---
snmp-server community campus-ro RO
snmp-server enable traps
snmp-server host 10.10.5.132 version 2c campus-ro

end
write memory
