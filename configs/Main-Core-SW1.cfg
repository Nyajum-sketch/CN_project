! ==============================================================================
! Device: Main-Core-SW1 (Cisco Catalyst 2960-24TT)
! Role: Main Distribution / Core Switch 1
! Dependencies: Connect Gig0/1 to Main-Core-R1 Gig0/0 (802.1Q Trunk)
!               Connect Gig0/2 to Main-Core-SW2 Gig0/2 (Inter-Switch Trunk)
!               Connect Fa0/1 - Fa0/7 to Department Access Switches (Trunks)
! ==============================================================================

enable
configure terminal

hostname Main-Core-SW1

! --- Security & Remote Access Baseline ---
no ip domain-lookup
ip domain-name smartcampus.edu
enable secret CiscoUni2026!

username admin privilege 15 secret CiscoUni2026!
crypto key generate rsa modulus 2048
ip ssh version 2

line con 0
 password CiscoUni2026!
 login
 logging synchronous
 exec-timeout 10 0
 exit

line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0
 exit

banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED UNIVERSITY NETWORK ENGINEERING ACCESS ONLY              *
* Switch: Main-Core-SW1 | Role: Main Campus Aggregation Layer                 *
*******************************************************************************
^C

! --- Campus VLAN Database Definition ---
vlan 10
 name Admin_Department
 exit

vlan 20
 name Faculty_Department
 exit

vlan 30
 name Computer_Labs
 exit

vlan 40
 name Students_WiFi
 exit

vlan 50
 name Hostel_Residential
 exit

vlan 60
 name University_Library
 exit

vlan 70
 name Server_DataCenter
 exit

vlan 99
 name Network_Management
 exit

! --- Spanning Tree Architecture ---
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,70,99 root primary
spanning-tree vlan 40,50,60 root secondary

! --- 802.1Q Uplink Trunks to Routers and Core-SW2 ---
interface GigabitEthernet0/1
 description 802.1Q Trunk to Main-Core-R1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,99
 no shutdown
 exit

interface GigabitEthernet0/2
 description 802.1Q Trunk to Main-Core-SW2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70,99
 no shutdown
 exit

! --- Trunks to Department Access Switches ---
interface FastEthernet0/1
 description Trunk to SW-Admin
 switchport mode trunk
 switchport trunk allowed vlan 10,99
 no shutdown
 exit

interface FastEthernet0/2
 description Trunk to SW-Faculty
 switchport mode trunk
 switchport trunk allowed vlan 20,99
 no shutdown
 exit

interface FastEthernet0/3
 description Trunk to SW-Labs
 switchport mode trunk
 switchport trunk allowed vlan 30,99
 no shutdown
 exit

interface FastEthernet0/4
 description Trunk to SW-Students
 switchport mode trunk
 switchport trunk allowed vlan 40,99
 no shutdown
 exit

interface FastEthernet0/5
 description Trunk to SW-Hostel
 switchport mode trunk
 switchport trunk allowed vlan 50,99
 no shutdown
 exit

interface FastEthernet0/6
 description Trunk to SW-Library
 switchport mode trunk
 switchport trunk allowed vlan 60,99
 no shutdown
 exit

interface FastEthernet0/7
 description Trunk to SW-ServerFarm
 switchport mode trunk
 switchport trunk allowed vlan 70,99
 no shutdown
 exit

! --- Switch Management SVI ---
interface Vlan99
 description In-Band Network Management
 ip address 10.10.5.164 255.255.255.240
 no shutdown
 exit

ip default-gateway 10.10.5.161

! --- Port Security & Unused Port Shutdown ---
interface range FastEthernet0/8 - 24
 shutdown
 exit

end
write memory
