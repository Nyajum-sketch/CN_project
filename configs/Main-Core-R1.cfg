! ==============================================================================
! Device: Main-Core-R1 (Cisco 2911 ISR)
! Role: Active HSRP Gateway for VLANs 10, 20, 30, 70, 99; OSPF Area 1 ABR
! Dependencies: Connect Gig0/0 to Main-Core-SW1 Gig0/1 (Trunk)
!               Connect Gig0/1 to Main-Core-R2 Gig0/1 (P2P Interconnect)
!               Connect Gig0/2 to Main-Edge-Rtr Gig0/0 (Transit Link)
! ==============================================================================

enable
configure terminal

hostname Main-Core-R1

! --- Security & Remote Access Baseline ---
no ip domain-lookup
ip domain-name smartcampus.edu
enable secret CiscoUni2026!

username admin privilege 15 secret CiscoUni2026!
crypto key generate rsa modulus 2048
ip ssh version 2

line con 0
 password CiscoUni2026!
 login
 logging synchronous
 exec-timeout 10 0
 exit

line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
 exit

banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED UNIVERSITY NETWORK ENGINEERING ACCESS ONLY              *
* System: Main-Core-R1 | Location: Main Campus Central Server Facility        *
*******************************************************************************
^C

! --- Inter-VLAN Routing Subinterfaces (802.1Q) & HSRP Configuration ---
interface GigabitEthernet0/0
 no ip address
 no shutdown
 exit

! VLAN 10: Administration (HSRP Active)
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 10.10.5.2 255.255.255.192
 standby 10 ip 10.10.5.1
 standby 10 priority 110
 standby 10 preempt
 standby 10 track GigabitEthernet0/2 25
 no shutdown
 exit

! VLAN 20: Faculty (HSRP Active)
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 10.10.4.130 255.255.255.128
 standby 20 ip 10.10.4.129
 standby 20 priority 110
 standby 20 preempt
 standby 20 track GigabitEthernet0/2 25
 no shutdown
 exit

! VLAN 30: Computer Labs (HSRP Active)
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 10.10.4.2 255.255.255.128
 standby 30 ip 10.10.4.1
 standby 30 priority 110
 standby 30 preempt
 standby 30 track GigabitEthernet0/2 25
 no shutdown
 exit

! VLAN 40: Students & Wi-Fi (HSRP Standby)
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 10.10.2.2 255.255.254.0
 standby 40 ip 10.10.2.1
 standby 40 priority 90
 standby 40 preempt
 no shutdown
 exit

! VLAN 50: Hostel & Wi-Fi (HSRP Standby)
interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 ip address 10.10.0.2 255.255.254.0
 standby 50 ip 10.10.0.1
 standby 50 priority 90
 standby 50 preempt
 no shutdown
 exit

! VLAN 60: University Library (HSRP Standby)
interface GigabitEthernet0/0.60
 encapsulation dot1Q 60
 ip address 10.10.5.66 255.255.255.192
 standby 60 ip 10.10.5.65
 standby 60 priority 90
 standby 60 preempt
 no shutdown
 exit

! VLAN 70: Data Center / Server Farm (HSRP Active)
interface GigabitEthernet0/0.70
 encapsulation dot1Q 70
 ip address 10.10.5.134 255.255.255.224
 standby 70 ip 10.10.5.129
 standby 70 priority 110
 standby 70 preempt
 standby 70 track GigabitEthernet0/2 25
 no shutdown
 exit

! VLAN 99: IT & NOC Management (HSRP Active)
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99
 ip address 10.10.5.162 255.255.255.240
 standby 99 ip 10.10.5.161
 standby 99 priority 110
 standby 99 preempt
 no shutdown
 exit

! --- Inter-Router Physical Transit Interfaces ---
! Core Interconnect to Main-Core-R2
interface GigabitEthernet0/1
 description Interconnect Link to Main-Core-R2
 ip address 10.10.7.1 255.255.255.252
 no shutdown
 exit

! Transit Link to Main-Edge-Rtr
interface GigabitEthernet0/2
 description Transit Link to Main-Edge-Rtr
 ip address 10.10.7.5 255.255.255.252
 no shutdown
 exit

! --- Dynamic Host Configuration Protocol (DHCP) Server Pools ---
ip dhcp excluded-address 10.10.5.1 10.10.5.10
ip dhcp excluded-address 10.10.4.129 10.10.4.140
ip dhcp excluded-address 10.10.4.1 10.10.4.10
ip dhcp excluded-address 10.10.2.1 10.10.2.20
ip dhcp excluded-address 10.10.0.1 10.10.0.20
ip dhcp excluded-address 10.10.5.65 10.10.5.75
ip dhcp excluded-address 10.10.5.129 10.10.5.140
ip dhcp excluded-address 10.10.5.161 10.10.5.165

! Admin DHCP Pool
ip dhcp pool POOL-ADMIN
 network 10.10.5.0 255.255.255.192
 default-router 10.10.5.1
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! Faculty DHCP Pool
ip dhcp pool POOL-FACULTY
 network 10.10.4.128 255.255.255.128
 default-router 10.10.4.129
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! Computer Labs DHCP Pool
ip dhcp pool POOL-LABS
 network 10.10.4.0 255.255.255.128
 default-router 10.10.4.1
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! Students DHCP Pool
ip dhcp pool POOL-STUDENTS
 network 10.10.2.0 255.255.254.0
 default-router 10.10.2.1
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! Hostel DHCP Pool
ip dhcp pool POOL-HOSTEL
 network 10.10.0.0 255.255.254.0
 default-router 10.10.0.1
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! Library DHCP Pool
ip dhcp pool POOL-LIBRARY
 network 10.10.5.64 255.255.255.192
 default-router 10.10.5.65
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! --- Multi-Area OSPF Routing Protocol ---
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 ! Area 0 Backbone Connection (Transit to Edge)
 network 10.10.7.4 0.0.0.3 area 0
 ! Area 1 Internal Core Interconnect
 network 10.10.7.0 0.0.0.3 area 1
 ! Area 1 Campus Department Subnets
 network 10.10.0.0 0.0.1.255 area 1
 network 10.10.2.0 0.0.1.255 area 1
 network 10.10.4.0 0.0.0.127 area 1
 network 10.10.4.128 0.0.0.127 area 1
 network 10.10.5.0 0.0.0.63 area 1
 network 10.10.5.64 0.0.0.63 area 1
 network 10.10.5.128 0.0.0.31 area 1
 network 10.10.5.160 0.0.0.15 area 1
 ! OSPF Route Summarization into Area 0 (Generates Type 3 Summary LSA)
 area 1 range 10.10.0.0 255.255.248.0
 ! Passive Interfaces on End-User VLANs to conserve bandwidth and protect routing engine
 passive-interface GigabitEthernet0/0.10
 passive-interface GigabitEthernet0/0.20
 passive-interface GigabitEthernet0/0.30
 passive-interface GigabitEthernet0/0.40
 passive-interface GigabitEthernet0/0.50
 passive-interface GigabitEthernet0/0.60
 passive-interface GigabitEthernet0/0.70
 passive-interface GigabitEthernet0/0.99
 exit

! --- Access Control Lists (ACLs) - University Security Policy ---
! Restrict Student VLAN from accessing Admin and Management Subnets
ip access-list extended ACL-STUDENT-POLICY
 remark Allow DNS queries to Data Center DNS Server
 permit udp 10.10.2.0 0.0.1.255 host 10.10.5.130 eq domain
 remark Allow Web access to University Web Portal
 permit tcp 10.10.2.0 0.0.1.255 host 10.10.5.130 eq www
 permit tcp 10.10.2.0 0.0.1.255 host 10.10.5.130 eq 443
 remark Allow Email access to Mail Server (SMTP/POP3)
 permit tcp 10.10.2.0 0.0.1.255 host 10.10.5.131 eq smtp
 permit tcp 10.10.2.0 0.0.1.255 host 10.10.5.131 eq pop3
 remark Allow FTP downloads from FTP Server
 permit tcp 10.10.2.0 0.0.1.255 host 10.10.5.132 eq ftp
 permit tcp 10.10.2.0 0.0.1.255 host 10.10.5.132 eq ftp-data
 remark Deny Student traffic to Admin and NOC subnets
 deny ip 10.10.2.0 0.0.1.255 10.10.5.0 0.0.0.63
 deny ip 10.10.2.0 0.0.1.255 10.10.5.160 0.0.0.15
 remark Permit all other student traffic (Internet / Remote campus)
 permit ip 10.10.2.0 0.0.1.255 any
 exit

interface GigabitEthernet0/0.40
 ip access-group ACL-STUDENT-POLICY in
 exit

! --- SNMP Management Configuration ---
snmp-server community campus-ro RO
snmp-server community campus-rw RW
snmp-server enable traps
snmp-server host 10.10.5.132 version 2c campus-ro

end
write memory
