! ==============================================================================
! Device: ISP-Router (Cisco 2911 ISR)
! Role: Simulated Internet Service Provider (Public WAN Backbone)
! Dependencies: Connect Gig0/0 to Main-Edge-Rtr Gig0/2 (Public WAN Link 1)
!               Connect Gig0/1 to Remote-Edge-Rtr Gig0/0 (Public WAN Link 2)
!               Connect Serial0/0/0 to Main-Edge-Rtr Serial0/0/0 (Isolated RIPv2 Link)
! ==============================================================================

enable
configure terminal

hostname ISP-Router

! --- Security & Basic Setup ---
no ip domain-lookup
enable secret CiscoUni2026!

line con 0
 password CiscoUni2026!
 login
 logging synchronous
 exec-timeout 10 0
 exit

line vty 0 4
 password CiscoUni2026!
 login
 exec-timeout 10 0
 exit

banner motd ^C
*******************************************************************************
* PUBLIC INTERNET SERVICE PROVIDER SIMULATION ROUTER (BACKBONE TRANSIT)       *
*******************************************************************************
^C

! --- WAN Interfaces ---
! Main Campus WAN Connection
interface GigabitEthernet0/0
 description Public WAN Link to Main-Edge-Rtr
 ip address 203.0.113.2 255.255.255.252
 no shutdown
 exit

! Remote Campus WAN Connection
interface GigabitEthernet0/1
 description Public WAN Link to Remote-Edge-Rtr
 ip address 203.0.113.6 255.255.255.252
 no shutdown
 exit

! Isolated Serial Link for RIPv2 Testing
interface Serial0/0/0
 description Isolated Serial Link to Main-Edge-Rtr
 ip address 198.51.100.2 255.255.255.252
 clock rate 64000
 no shutdown
 exit

! Simulated Public Internet Root DNS / External Server
interface Loopback0
 description Public Internet DNS Simulation (Google DNS)
 ip address 8.8.8.8 255.255.255.255
 no shutdown
 exit

! --- Isolated RIPv2 Configuration for Routing Protocol Experiment ---
router rip
 version 2
 no auto-summary
 timers basic 30 180 180 240
 network 198.51.100.0
 passive-interface default
 no passive-interface Serial0/0/0
 exit

end
write memory
