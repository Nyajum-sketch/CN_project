! ==============================================================================
! Device: Remote-Edge-Rtr (Cisco 2911 ISR)
! Role: Remote Satellite Campus Gateway, Inter-VLAN Routing, DHCP Server,
!       IPsec Site-to-Site VPN Termination, NAT/PAT
! Dependencies: Connect Gig0/0 to ISP-Router Gig0/1 (Public WAN Link 2)
!               Connect Gig0/1 to Remote-SW1 Gig0/1 (802.1Q Trunk)
! ==============================================================================

enable
configure terminal

hostname Remote-Edge-Rtr

! --- Security & Remote Access Baseline ---
no ip domain-lookup
ip domain-name smartcampus.edu
enable secret CiscoUni2026!

username admin privilege 15 secret CiscoUni2026!
crypto key generate rsa modulus 2048
ip ssh version 2

line con 0
 password CiscoUni2026!
 login
 logging synchronous
 exec-timeout 10 0
 exit

line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
 exit

banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED UNIVERSITY NETWORK ENGINEERING ACCESS ONLY              *
* System: Remote-Edge-Rtr | Location: Remote Satellite Campus Branch Gateway  *
*******************************************************************************
^C

! --- Public WAN Interface ---
interface GigabitEthernet0/0
 description Public WAN Interface to ISP-Router
 ip address 203.0.113.5 255.255.255.252
 ip nat outside
 crypto map CAMPUS-VPN-MAP
 no shutdown
 exit

! --- Inter-VLAN Subinterfaces (802.1Q Trunk) ---
interface GigabitEthernet0/1
 no ip address
 no shutdown
 exit

! VLAN 110: Remote Staff & Administration
interface GigabitEthernet0/1.110
 encapsulation dot1Q 110
 ip address 10.10.6.129 255.255.255.224
 ip nat inside
 no shutdown
 exit

! VLAN 140: Remote Students & Labs
interface GigabitEthernet0/1.140
 encapsulation dot1Q 140
 ip address 10.10.6.1 255.255.255.128
 ip nat inside
 no shutdown
 exit

! VLAN 199: Remote Management
interface GigabitEthernet0/1.199
 encapsulation dot1Q 199
 ip address 10.10.6.161 255.255.255.240
 ip nat inside
 no shutdown
 exit

! --- Remote Campus DHCP Server Pools ---
ip dhcp excluded-address 10.10.6.129 10.10.6.135
ip dhcp excluded-address 10.10.6.1 10.10.6.10

! Remote Staff Pool
ip dhcp pool REMOTE-POOL-STAFF
 network 10.10.6.128 255.255.255.224
 default-router 10.10.6.129
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! Remote Students Pool
ip dhcp pool REMOTE-POOL-STUDENTS
 network 10.10.6.0 255.255.255.128
 default-router 10.10.6.1
 dns-server 10.10.5.130
 domain-name smartcampus.edu
 exit

! --- Default Routing ---
ip route 0.0.0.0 0.0.0.0 203.0.113.6
! Static route for Main Campus across VPN peer (routing engine pointer)
ip route 10.10.0.0 255.255.248.0 203.0.113.6

! --- Network Address Translation (NAT / PAT) with VPN Bypass ---
ip access-list extended ACL-REMOTE-NAT
 remark Bypass NAT for Site-to-Site VPN Traffic to Main Campus
 deny ip 10.10.6.0 0.0.0.255 10.10.0.0 0.0.7.255
 remark Permit outbound Internet for Remote Campus subnets
 permit ip 10.10.6.0 0.0.0.255 any
 exit

ip nat inside source list ACL-REMOTE-NAT interface GigabitEthernet0/0 overload

! --- Site-to-Site IPsec VPN Configuration (Remote to Main Campus) ---
! 1. ISAKMP Phase 1 Policy
crypto isakmp policy 10
 encr aes
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
 exit

! 2. ISAKMP Pre-Shared Key (Must match Main Edge Router)
crypto isakmp key CiscoUni2026! address 203.0.113.1

! 3. IPsec Phase 2 Transform Set
crypto ipsec transform-set CAMPUS-TS esp-aes esp-sha-hmac
 exit

! 4. Crypto Access-List defining Interesting Traffic
ip access-list extended ACL-REMOTE-VPN
 remark Interesting Traffic: Remote Subnets to Main Campus Supernet
 permit ip 10.10.6.0 0.0.0.255 10.10.0.0 0.0.7.255
 exit

! 5. Crypto Map Association
crypto map CAMPUS-VPN-MAP 10 ipsec-isakmp
 set peer 203.0.113.1
 set transform-set CAMPUS-TS
 match address ACL-REMOTE-VPN
 exit

! --- Inbound WAN Security Policy ---
ip access-list extended ACL-REMOTE-FIREWALL
 remark Allow ISAKMP and IPsec negotiation from Main Edge Router
 permit udp host 203.0.113.1 host 203.0.113.5 eq isakmp
 permit esp host 203.0.113.1 host 203.0.113.5
 remark Allow return ICMP diagnostic traffic
 permit icmp any any echo-reply
 permit icmp any any unreachable
 remark Allow return TCP traffic for established connections
 permit tcp any 10.10.6.0 0.0.0.255 established
 deny ip any any
 exit

interface GigabitEthernet0/0
 ip access-group ACL-REMOTE-FIREWALL in
 exit

end
write memory
