! ==============================================================================
! Configurations for Campus Access Switches
! Model: Cisco Catalyst 2960-24TT (Universal Packet Tracer Support)
! Features: 802.1Q Trunks, Department Access Ports, Port Security (Sticky MAC),
!           Spanning-Tree PortFast, BPDU Guard, SSH Management
! ==============================================================================

! ==============================================================================
! SWITCH 1: SW-Admin (Administration Department - VLAN 10)
! ==============================================================================
enable
configure terminal
hostname SW-Admin
no ip domain-lookup
ip domain-name smartcampus.edu
enable secret CiscoUni2026!

vlan 10
 name Admin_Department
 exit
vlan 99
 name Network_Management
 exit

interface GigabitEthernet0/1
 description 802.1Q Trunk to Main-Core-SW1
 switchport mode trunk
 switchport trunk allowed vlan 10,99
 no shutdown
 exit

! Access Ports for Admin Staff PCs with Port Security
interface range FastEthernet0/1 - 23
 description Admin Staff Workstations
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
 exit

interface FastEthernet0/24
 shutdown
 exit

interface Vlan99
 description Admin Switch Management SVI
 ip address 10.10.5.166 255.255.255.240
 no shutdown
 exit
ip default-gateway 10.10.5.161
end
write memory


